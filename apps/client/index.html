<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime World</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <canvas id="world" aria-label="3D world viewer"></canvas>
      <section class="overlay" aria-live="polite">
        <h1>Realtime World</h1>
        <p>Seed <span id="world-seed"></span> · generated 64×64 terrain</p>
        <p id="player-status">WASD / arrow keys to move</p>
        <p>Right-drag pans · wheel zooms · R resets camera</p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
